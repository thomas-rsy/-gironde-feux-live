<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FeuScope - NASA FIRMS</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { height: 100%; width: 100vw; overflow: hidden; background-color: #fff; color: #111; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    
    header {
      padding: 15px 20px;
      padding-top: calc(15px + env(safe-area-inset-top));
      background: #ffffff;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000; border-bottom: 1px solid #eee;
    }
    .logo { font-size: 1.3rem; font-weight: 800; color: #d32f2f; }
    .badge { background: #d32f2f; color: #fff; font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; font-weight: 700; }

    #map { flex: 1; width: 100%; z-index: 1; }

    footer {
      padding: 15px 20px;
      padding-bottom: calc(15px + env(safe-area-inset-bottom));
      background: #ffffff;
      z-index: 1000; display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid #eee;
    }
    .status { font-size: 0.85rem; color: #555; }
    .status strong { color: #d32f2f; }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="logo">🔥 FeuScope</div>
      <div class="badge">NASA Live</div>
    </header>

    <div id="map"></div>

    <footer>
      <div class="status" id="status-info">Chargement des hotspots...</div>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([44.55, -1.15], 9);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    // Bounding Box : Gironde / Landes (-1.8, 44.0, 0.2, 45.6)
    // Clé API NASA FIRMS publique
    const apiKey = 'c46522c7104b281f6213bd8a2d1e21b0';
    const area = '-1.8,44.0,0.2,45.6';
    const url = `https://firms.modaps.eosdis.nasa.gov/api/area/csv/${apiKey}/VIIRS_SNPP_NRT/${area}/2`;

    // Utilisation d'un proxy AllOrigins pour contourner le strict CORS de Safari
    fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`)
      .then(response => {
        if (response.ok) return response.json();
        throw new Error('Erreur réseau');
      })
      .then(data => {
        const csv = data.contents;
        const lines = csv.split('\n').slice(1);
        let count = 0;

        lines.forEach(line => {
          const cols = line.split(',');
          if (cols.length > 2) {
            const lat = parseFloat(cols[1]);
            const lng = parseFloat(cols[2]);
            const bright = parseFloat(cols[3]);

            if (!isNaN(lat) && !isNaN(lng)) {
              count++;
              L.circleMarker([lat, lng], {
                radius: 7,
                color: '#ffffff',
                weight: 1.5,
                fillColor: '#d32f2f',
                fillOpacity: 0.9
              }).addTo(map).bindPopup(`<b>🔥 Foyer Détecté (NASA)</b><br>Intensité : ${bright} K<br>Lat : ${lat} | Lng : ${lng}`);
            }
          }
        });

        document.getElementById('status-info').innerHTML = count > 0 
          ? `NASA FIRMS : <strong>${count} points chauds détectés (48h)</strong>`
          : "NASA FIRMS : Aucun point détecté sur la zone";
      })
      .catch(err => {
        document.getElementById('status-info').innerHTML = "Erreur de synchronisation NASA";
      });
  </script>
</body>
</html>
