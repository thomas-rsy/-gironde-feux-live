<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FeuScope Europe Pro v29</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { height: 100%; width: 100vw; overflow: hidden; background-color: #f8f9fa; color: #111; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; position: relative; }

    /* Top Bar Alert */
    .top-alert {
      background: #fff3e0; border-bottom: 1px solid #ffe0b2; padding: 8px 14px;
      padding-top: calc(8px + env(safe-area-inset-top));
      font-size: 0.75rem; color: #e65100; font-weight: 600; display: flex; align-items: center; justify-content: space-between;
      z-index: 1001;
    }

    /* Controls Top Header */
    .controls-top {
      position: absolute; top: calc(48px + env(safe-area-inset-top)); right: 12px; left: 12px;
      z-index: 1000; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }

    .search-box {
      display: flex; gap: 6px; background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 6px 12px; border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12); border: 1px solid rgba(0,0,0,0.08); flex: 1;
    }
    .search-box input { border: none; background: transparent; font-size: 0.82rem; outline: none; width: 100%; font-weight: 600; }
    
    .btn-layers {
      background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); border: 1px solid rgba(0,0,0,0.08);
      padding: 8px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 800; color: #333;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12); cursor: pointer; white-space: nowrap;
    }

    /* Drawer Menu */
    #layer-menu {
      position: absolute; top: calc(95px + env(safe-area-inset-top)); right: 12px; width: 260px;
      background: rgba(255,255,255,0.96); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      border-radius: 16px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); z-index: 1002;
      display: none; border: 1px solid rgba(0,0,0,0.08);
    }
    #layer-menu.active { display: block; }
    .menu-title { font-size: 0.7rem; font-weight: 800; color: #888; text-transform: uppercase; margin-bottom: 8px; margin-top: 6px; }
    .menu-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; margin-bottom: 8px; color: #222; }
    .menu-item input { accent-color: #d32f2f; width: 18px; height: 18px; }

    #map { flex: 1; width: 100%; z-index: 1; background: #e5e3df; }

    /* Bottom Player */
    .player-card {
      position: absolute; bottom: calc(20px + env(safe-area-inset-bottom)); left: 12px; right: 12px;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 18px; padding: 12px 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      z-index: 1000; display: flex; flex-direction: column; gap: 8px; border: 1px solid rgba(0,0,0,0.05);
    }
    .player-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; font-weight: 800; color: #444; }
    .player-controls { display: flex; align-items: center; gap: 12px; }
    .btn-play { background: #e65100; border: none; width: 36px; height: 36px; border-radius: 50%; color: white; font-size: 1rem; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .timeline { flex: 1; accent-color: #e65100; }
    .btn-now { background: #f0f0f2; border: none; padding: 6px 12px; border-radius: 14px; font-size: 0.72rem; font-weight: 700; color: #333; }

    .air-badge { background: #22c55e; color: white; font-size: 0.7rem; font-weight: 800; padding: 3px 8px; border-radius: 10px; }
  </style>
</head>
<body>

  <div id="app">
    <div class="top-alert">
      <span id="fire-count-info">Chargement des foyers européens...</span>
      <span class="air-badge" id="air-status">Air : Bon</span>
    </div>

    <div class="controls-top">
      <div class="search-box">
        <input type="text" id="citySearch" placeholder="Ma commune (Europe)..." onkeypress="if(event.key==='Enter') searchCity()">
      </div>
      <button class="btn-layers" onclick="toggleMenu()">🎛️ Réglages</button>
    </div>

    <!-- Menu Réglages & Choix de l'animation -->
    <div id="layer-menu">
      <div class="menu-title">Affichage Cartographique</div>
      <div class="menu-item">
        <span>🔥 Foyers Satellites (NASA)</span>
        <input type="checkbox" id="chk-fires" checked onchange="toggleLayers()">
      </div>
      <div class="menu-item">
        <span>💨 Panache de Fumée</span>
        <input type="checkbox" id="chk-plume" checked onchange="toggleLayers()">
      </div>
      <div class="menu-item">
        <span>🫁 Qualité de l'Air (ICA)</span>
        <input type="checkbox" id="chk-air" checked onchange="toggleLayers()">
      </div>

      <div style="border-top:1px solid #eee; margin:10px 0;"></div>

      <div class="menu-title">Éléments à Animer (▶)</div>
      <div class="menu-item">
        <span>Animer le Panache</span>
        <input type="checkbox" id="anim-plume" checked>
      </div>
      <div class="menu-item">
        <span>Animer la Qualité de l'Air</span>
        <input type="checkbox" id="anim-air" checked>
      </div>
      <div class="menu-item">
        <span>Animer l'Extension du Feu</span>
        <input type="checkbox" id="anim-front" checked>
      </div>
    </div>

    <div id="map"></div>

    <div class="player-card">
      <div class="player-header">
        <span>ANIMATION TEMPORELLE</span>
        <span id="time-display" style="color:#e65100;">Maintenant</span>
      </div>
      <div class="player-controls">
        <button class="btn-play" id="playBtn" onclick="togglePlay()">▶</button>
        <input type="range" class="timeline" id="timeRange" min="0" max="24" step="3" value="0" oninput="renderTimeline(this.value)">
        <button class="btn-now" onclick="resetTime()">Maintenant</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map;
    let firesGroup = L.layerGroup();
    let airGroup = L.layerGroup();
    let plumePolygon = null;
    let frontCircle = null;

    let isPlaying = false, timer = null;
    let selectedFire = [44.70, -1.05]; // Gironde par défaut

    window.addEventListener('load', () => {
      map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([46.00, 2.00], 5);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19, subdomains: 'abcd'
      }).addTo(map);

      firesGroup.addTo(map);
      airGroup.addTo(map);

      // Chargement direct des données NASA (France, Espagne, Portugal, Italie)
      fetchNasaEurope();

      renderTimeline(0);
    });

    // Chargement garanti sans blocage API
    function fetchNasaEurope() {
      const MAP_KEY = 'e65d83ae99a0d84c17cdddbdbbd815dc';
      const countries = ['FRA', 'ESP', 'PRT', 'ITA'];
      let totalFires = 0;

      const requests = countries.map(c => 
        fetch(`https://firms.modaps.eosdis.nasa.gov/api/country/csv/${MAP_KEY}/VIIRS_SNPP_NRT/${c}/1`)
          .then(r => r.text())
          .catch(() => "")
      );

      Promise.all(requests).then(results => {
        firesGroup.clearLayers();

        results.forEach(csvText => {
          if (!csvText) return;
          const lines = csvText.split('\n').slice(1);

          lines.forEach(line => {
            const cols = line.split(',');
            if (cols.length > 2) {
              const lat = parseFloat(cols[1]);
              const lon = parseFloat(cols[2]);

              if (!isNaN(lat) && !isNaN(lon)) {
                totalFires++;
                // Création visuelle claire du foyer (Puce rouge fluo à haute visibilité)
                const marker = L.circleMarker([lat, lon], {
                  radius: 7,
                  color: '#ffffff',
                  weight: 1.5,
                  fillColor: '#ff1744',
                  fillOpacity: 0.9
                });

                marker.on('click', () => {
                  selectedFire = [lat, lon];
                  renderTimeline(document.getElementById('timeRange').value);
                });

                firesGroup.addLayer(marker);
              }
            }
          });
        });

        document.getElementById('fire-count-info').innerHTML = `🔥 <b>${totalFires} foyers détectés</b> (Europe)`;
      });
    }

    // Moteur d'animation sélectionnable
    function renderTimeline(hours) {
      hours = parseInt(hours);
      document.getElementById('time-display').innerText = hours === 0 ? "Maintenant" : `+${hours}h`;

      const doPlume = document.getElementById('anim-plume').checked && document.getElementById('chk-plume').checked;
      const doAir = document.getElementById('anim-air').checked && document.getElementById('chk-air').checked;
      const doFront = document.getElementById('anim-front').checked;

      // 1. Animation Panache
      if (plumePolygon) map.removeLayer(plumePolygon);
      if (doPlume) {
        const hEffect = document.getElementById('anim-plume').checked ? hours : 0;
        const drift = hEffect * 0.015;
        const spread = 0.05 + (hEffect * 0.008);

        const coords = [
          selectedFire,
          [selectedFire[0] + spread, selectedFire[1] + 0.15 + drift],
          [selectedFire[0] + (spread * 1.5), selectedFire[1] + 0.35 + drift],
          [selectedFire[0] - (spread * 1.5), selectedFire[1] + 0.35 + drift],
          [selectedFire[0] - spread, selectedFire[1] + 0.15 + drift]
        ];

        plumePolygon = L.polygon(coords, {
          color: '#616161', weight: 1, fillColor: '#424242',
          fillOpacity: Math.min(0.25 + (hEffect * 0.012), 0.55), dashArray: '4, 4'
        }).addTo(map);
      }

      // 2. Animation Qualité de l'Air
      airGroup.clearLayers();
      if (document.getElementById('chk-air').checked) {
        const airHours = doAir ? hours : 0;
        const airRadius = 30000 + (airHours * 2000);

        L.circle(selectedFire, {
          stroke: false,
          fillColor: airHours >= 12 ? 'rgba(239, 68, 68, 0.35)' : 'rgba(245, 158, 11, 0.28)',
          fillOpacity: 1, radius: airRadius
        }).addTo(airGroup);

        const airBadge = document.getElementById('air-status');
        if (airHours >= 12) { airBadge.innerText = "Air : Tr. Mauvais (+12h)"; airBadge.style.background = "#d32f2f"; }
        else if (airHours >= 6) { airBadge.innerText = "Air : Dégradé (+6h)"; airBadge.style.background = "#f59e0b"; }
        else { airBadge.innerText = "Air : Bon"; airBadge.style.background = "#22c55e"; }
      }

      // 3. Animation Extension du Feu
      if (frontCircle) map.removeLayer(frontCircle);
      if (doFront && hours > 0) {
        const fireGrowth = hours * 300;
        frontCircle = L.circle(selectedFire, {
          color: '#ff9800', weight: 2, fillColor: '#ff5722', fillOpacity: 0.35, radius: 2000 + fireGrowth
        }).addTo(map);
      }
    }

    function toggleLayers() {
      if (document.getElementById('chk-fires').checked) { map.addLayer(firesGroup); }
      else { map.removeLayer(firesGroup); }

      if (document.getElementById('chk-air').checked) { map.addLayer(airGroup); }
      else { map.removeLayer(airGroup); }

      renderTimeline(document.getElementById('timeRange').value);
    }

    function toggleMenu() {
      document.getElementById('layer-menu').classList.toggle('active');
    }

    function togglePlay() {
      const btn = document.getElementById('playBtn');
      const range = document.getElementById('timeRange');
      if (isPlaying) {
        clearInterval(timer); btn.innerText = '▶'; isPlaying = false;
      } else {
        btn.innerText = '⏸'; isPlaying = true;
        timer = setInterval(() => {
          let val = parseInt(range.value) + 3;
          if (val > 24) val = 0;
          range.value = val;
          renderTimeline(val);
        }, 1200);
      }
    }

    function resetTime() {
      if (isPlaying) togglePlay();
      document.getElementById('timeRange').value = 0;
      renderTimeline(0);
    }

    function searchCity() {
      const q = document.getElementById('citySearch').value;
      if (!q) return;

      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`)
        .then(r => r.json())
        .then(data => {
          if (data && data.length > 0) {
            const lat = parseFloat(data[0].lat);
            const lon = parseFloat(data[0].lon);
            map.flyTo([lat, lon], 10);
            L.popup().setLatLng([lat, lon]).setContent(`<b>📍 ${data[0].display_name.split(',')[0]}</b>`).openOn(map);
          }
        });
    }
  </script>
</body>
</html>
