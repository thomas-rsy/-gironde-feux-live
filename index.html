<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FeuScope - NASA GIBS Live</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { height: 100%; width: 100vw; overflow: hidden; background-color: #fff; color: #111; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    
    header {
      padding: 15px 20px;
      padding-top: calc(15px + env(safe-area-inset-top));
      background: #ffffff;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000; border-bottom: 1px solid #eee;
    }
    .logo { font-size: 1.3rem; font-weight: 800; color: #d32f2f; }
    .badge { background: #d32f2f; color: #fff; font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; font-weight: 700; }

    #map { flex: 1; width: 100%; z-index: 1; }

    footer {
      padding: 15px 20px;
      padding-bottom: calc(15px + env(safe-area-inset-bottom));
      background: #ffffff;
      z-index: 1000; display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid #eee;
    }
    .status { font-size: 0.85rem; color: #555; }
    .status strong { color: #d32f2f; }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="logo">🔥 FeuScope</div>
      <div class="badge">NASA GIBS</div>
    </header>

    <div id="map"></div>

    <footer>
      <div class="status" id="status-info">Chargement de la couche satellite...</div>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([44.837789, -0.57918], 10);

    // Fond OpenStreetMap fluide
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    // Calcul de la date UTC (Aujourd'hui / Hier)
    const now = new Date();
    const dateStr = now.toISOString().split('T')[0];

    // Tuiles thermiques NASA GIBS
    const nasaLayer = L.tileLayer('https://gibs-{s}.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_Thermal_Anomalies_375m_Day/default/{time}/GoogleMapsCompatible_Level8/{z}/{y}/{x}.png', {
      subdomains: 'abc',
      time: dateStr,
      tileSize: 256,
      opacity: 0.8,
      attribution: 'NASA Earthdata / FIRMS'
    });

    nasaLayer.addTo(map);

    nasaLayer.on('load', function () {
      document.getElementById('status-info').innerHTML = "NASA GIBS : <strong>Flux actif & synchronisé</strong>";
    });

    nasaLayer.on('tileerror', function () {
      // Si la date du jour est trop récente, bascule sur hier
      const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
      nasaLayer.options.time = yesterday;
      nasaLayer.redraw();
      document.getElementById('status-info').innerHTML = "NASA GIBS : <strong>Flux synchronisé (dernières 24h)</strong>";
    });
  </script>
</body>
</html>
