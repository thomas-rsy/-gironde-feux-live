<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FeuScope - NASA Live NRT</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { height: 100%; width: 100vw; overflow: hidden; background-color: #fff; color: #111; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    
    header {
      padding: 15px 20px;
      padding-top: calc(15px + env(safe-area-inset-top));
      background: #ffffff;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000; border-bottom: 1px solid #eee;
    }
    .logo { font-size: 1.3rem; font-weight: 800; color: #d32f2f; }
    .badge { background: #d32f2f; color: #fff; font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; font-weight: 700; }

    #map { flex: 1; width: 100%; z-index: 1; }

    footer {
      padding: 15px 20px;
      padding-bottom: calc(15px + env(safe-area-inset-bottom));
      background: #ffffff;
      z-index: 1000; display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid #eee;
    }
    .status { font-size: 0.85rem; color: #555; }
    .status strong { color: #d32f2f; }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="logo">🔥 FeuScope</div>
      <div class="badge">NASA NRT Live</div>
    </header>

    <div id="map"></div>

    <footer>
      <div class="status" id="status-info">Chargement satellite temps réel...</div>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([44.5, -1.1], 9);

    // Fond OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    // Date du jour ISO
    const today = new Date().toISOString().split('T')[0];

    // Couche NRT NOAA-20 VIIRS 375m (Flux quasi-instantané)
    const nasaNrtLayer = L.tileLayer('https://gibs-{s}.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_NOAA20_Thermal_Anomalies_375m_Day/default/{time}/GoogleMapsCompatible_Level8/{z}/{y}/{x}.png', {
      subdomains: 'abc',
      time: today,
      tileSize: 256,
      opacity: 0.85,
      attribution: 'NASA GIBS / FIRMS'
    });

    nasaNrtLayer.addTo(map);

    nasaNrtLayer.on('load', function () {
      document.getElementById('status-info').innerHTML = "NASA NRT : <strong>Flux direct synchronisé</strong>";
    });

    nasaNrtLayer.on('tileerror', function () {
      // Bascule sur la veille si les données de la journée sont en cours de compilation
      const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
      nasaNrtLayer.options.time = yesterday;
      nasaNrtLayer.redraw();
      document.getElementById('status-info').innerHTML = "NASA NRT : <strong>Relevés 24h chargés</strong>";
    });
  </script>
</body>
</html>
