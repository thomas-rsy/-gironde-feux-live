<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FeuScope - Radar Thermique NASA</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121212">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { height: 100%; width: 100vw; overflow: hidden; background-color: #121212; color: #fff; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    
    header {
      padding: 15px 20px;
      padding-top: calc(15px + env(safe-area-inset-top));
      background: rgba(18, 18, 18, 0.95);
      backdrop-filter: blur(10px);
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo { font-size: 1.3rem; font-weight: 800; color: #ff5252; }
    .badge { background: #ff2a00; color: #fff; font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; font-weight: 700; }

    #map { flex: 1; width: 100%; z-index: 1; }

    footer {
      padding: 15px 20px;
      padding-bottom: calc(15px + env(safe-area-inset-bottom));
      background: rgba(18, 18, 18, 0.95);
      backdrop-filter: blur(10px);
      z-index: 1000; display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .status { font-size: 0.8rem; color: #aaa; }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="logo">🔥 FeuScope</div>
      <div class="badge">Couche Thermal NASA</div>
    </header>

    <div id="map"></div>

    <footer>
      <div class="status">Zones thermiques & fronts d'incendies (Gironde)</div>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Carte centrée sur la Gironde
    const map = L.map('map', { zoomControl: false }).setView([44.837789, -0.57918], 9);

    // 1. Fond de carte sombre
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap © CARTO'
    }).addTo(map);

    // 2. Couche Thermique NASA FIRMS (Anomalies thermiques / Zones rouges d'incendies)
    const today = new Date().toISOString().split('T')[0];
    
    L.tileLayer.wms('https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi', {
      layers: 'VIIRS_SNPP_Thermal_Anomalies_375m_Day',
      format: 'image/png',
      transparent: true,
      time: today,
      opacity: 0.8,
      attribution: 'NASA GIBS / FIRMS'
    }).addTo(map);

    // 3. Couche Thermique Nuit (pour choper les feux nocturnes)
    L.tileLayer.wms('https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi', {
      layers: 'VIIRS_SNPP_Thermal_Anomalies_375m_Night',
      format: 'image/png',
      transparent: true,
      time: today,
      opacity: 0.85,
      attribution: 'NASA GIBS'
    }).addTo(map);
  </script>
</body>
</html>
