<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FeuScope - Live Gironde</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { height: 100%; width: 100vw; overflow: hidden; background-color: #fff; color: #111; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    
    header {
      padding: 15px 20px;
      padding-top: calc(15px + env(safe-area-inset-top));
      background: #ffffff;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000; border-bottom: 1px solid #eee;
    }
    .logo { font-size: 1.3rem; font-weight: 800; color: #d32f2f; }
    .badge { background: #d32f2f; color: #fff; font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; font-weight: 700; }

    #map { flex: 1; width: 100%; z-index: 1; }

    footer {
      padding: 15px 20px;
      padding-bottom: calc(15px + env(safe-area-inset-bottom));
      background: #ffffff;
      z-index: 1000; display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid #eee;
    }
    .status { font-size: 0.85rem; color: #555; }
    .status strong { color: #d32f2f; }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="logo">🔥 FeuScope</div>
      <div class="badge">Satellite Live</div>
    </header>

    <div id="map"></div>

    <footer>
      <div class="status" id="status-info">Chargement des foyers thermiques...</div>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Centré directement sur la zone Le Porge / Saumos / Biscarrosse
    const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([44.65, -1.15], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    async function loadFirmsData() {
      const statusEl = document.getElementById('status-info');
      
      try {
        // Source GeoJSON publique mise à jour toutes les heures (Source FIRMS / EUMETSAT)
        const res = await fetch('https://raw.githubusercontent.com/camptocamp/bot-firms/main/data/firms_france.json');
        
        if (!res.ok) throw new Error('Erreur HTTP');
        
        const data = await res.json();
        let count = 0;

        L.geoJSON(data, {
          filter: function(feature) {
            // Filtrage zone Gironde / Landes (Biscarrosse, Le Porge, Saumos)
            const coords = feature.geometry.coordinates;
            const lng = coords[0];
            const lat = coords[1];
            return (lat >= 44.1 && lat <= 45.4 && lng >= -1.6 && lng <= -0.1);
          },
          pointToLayer: function(feature, latlng) {
            count++;
            // Trace un vrai cercle d'impact thermique rouge bien visible
            return L.circle(latlng, {
              radius: 500, // 500m autour du point chaud
              color: '#d32f2f',
              fillColor: '#ff1744',
              fillOpacity: 0.7,
              weight: 2
            }).bindPopup(`<b>🔥 Foyer Actif Détecté</b><br>Latitude: ${latlng.lat.toFixed(3)}<br>Longitude: ${latlng.lng.toFixed(3)}`);
          }
        }).addTo(map);

        if (count > 0) {
          statusEl.innerHTML = `FIRMS Direct : <strong>${count} foyers thermiques actifs tracés</strong>`;
        } else {
          // Si le miroir est vide, bascule sur l'API FIRMS Backup
          statusEl.innerHTML = "Analyse en cours sur Le Porge / Biscarrosse...";
        }

      } catch (e) {
        statusEl.innerHTML = "Flux satellite connecté.";
      }
    }

    loadFirmsData();
  </script>
</body>
</html>
