<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FeuScope - Gironde Live</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { height: 100%; width: 100vw; overflow: hidden; background-color: #fff; color: #111; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    
    header {
      padding: 15px 20px;
      padding-top: calc(15px + env(safe-area-inset-top));
      background: #ffffff;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000; border-bottom: 1px solid #eee;
    }
    .logo { font-size: 1.3rem; font-weight: 800; color: #d32f2f; }
    .badge { background: #d32f2f; color: #fff; font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; font-weight: 700; }

    #map { flex: 1; width: 100%; z-index: 1; }

    footer {
      padding: 15px 20px;
      padding-bottom: calc(15px + env(safe-area-inset-bottom));
      background: #ffffff;
      z-index: 1000; display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid #eee;
    }
    .status { font-size: 0.85rem; color: #555; }
    .status strong { color: #d32f2f; }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="logo">🔥 FeuScope</div>
      <div class="badge">NASA FIRMS</div>
    </header>

    <div id="map"></div>

    <footer>
      <div class="status" id="status-info">Analyse données NASA FIRMS...</div>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Zoom directement centré sur le secteur Le Porge / Saumos / Biscarrosse
    const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([44.55, -1.15], 9);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    async function loadNasaFirms() {
      const statusEl = document.getElementById('status-info');
      
      // Flux NASA France sur 3 jours (couvre Le Porge & Biscarrosse)
      const targetUrl = 'https://firms.modaps.eosdis.nasa.gov/api/country/csv/c46522c7104b281f6213bd8a2d1e21b0/VIIRS_SNPP_NRT/FRA/3';
      
      try {
        const response = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl));
        if (!response.ok) throw new Error('Erreur');

        const csvData = await response.text();
        const lines = csvData.trim().split('\n').slice(1);
        let fireCount = 0;

        lines.forEach(line => {
          const cols = line.split(',');
          if (cols.length >= 3) {
            const lat = parseFloat(cols[1]);
            const lng = parseFloat(cols[2]);
            const brightness = parseFloat(cols[3]);
            const date = cols[5] || '';
            const time = cols[6] || '';

            // Filtrage strict emprise Gironde / Landes (-1.8 à 0.2 long, 44.0 à 45.6 lat)
            if (lat >= 44.0 && lat <= 45.6 && lng >= -1.8 && lng <= 0.2) {
              fireCount++;

              // Marqueur rouge vif avec contour blanc ultra visible
              L.circleMarker([lat, lng], {
                radius: 8,
                color: '#ffffff',
                weight: 2,
                fillColor: '#d32f2f',
                fillOpacity: 0.9
              }).addTo(map).bindPopup(`
                <b>🔥 Foyer Thermique Satellite</b><br>
                <b>Coordonnées :</b> ${lat.toFixed(3)}, ${lng.toFixed(3)}<br>
                <b>Intensité :</b> ${brightness} K<br>
                <b>Détection :</b> ${date} à ${time} UTC<br>
                <small>Source : NASA VIIRS 375m</small>
              `);
            }
          }
        });

        if (fireCount > 0) {
          statusEl.innerHTML = `NASA FIRMS : <strong>${fireCount} foyers détectés (72h)</strong>`;
        } else {
          statusEl.innerHTML = "NASA FIRMS : <strong>0 foyer thermique actif détecté</strong>";
        }

      } catch (err) {
        statusEl.innerHTML = "Erreur de chargement des données NASA";
      }
    }

    loadNasaFirms();
  </script>
</body>
</html>
