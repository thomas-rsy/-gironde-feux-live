<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FeuScope - Live</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121212">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { height: 100%; width: 100vw; overflow: hidden; background-color: #121212; color: #fff; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    
    header {
      padding: 15px 20px;
      padding-top: calc(15px + env(safe-area-inset-top));
      background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(10px);
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo { font-size: 1.3rem; font-weight: 800; color: #ff5252; }
    .badge { background: #ff5252; color: #fff; font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; font-weight: 700; }

    #map { flex: 1; width: 100%; z-index: 1; }

    footer {
      padding: 15px 20px;
      padding-bottom: calc(15px + env(safe-area-inset-bottom));
      background: rgba(18, 18, 18, 0.95);
      backdrop-filter: blur(10px);
      z-index: 1000; display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .status-info { font-size: 0.85rem; color: #aaa; }
    .status-info strong { color: #ff5252; }

    .btn-gps {
      background: #ff5252; color: white; border: none; padding: 10px 18px;
      border-radius: 20px; font-weight: 600; font-size: 0.9rem; cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 82, 82, 0.4);
    }

    .leaflet-tile-layer {
      filter: brightness(0.7) invert(1) contrast(2.5) hue-rotate(200deg) saturate(0.3);
    }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="logo">🔥 FeuScope</div>
      <div class="badge">Satellite NASA Direct</div>
    </header>

    <div id="map"></div>

    <footer>
      <div class="status-info">
        <div id="fire-count">Détections : <strong>Analyse...</strong></div>
        <div id="last-update" style="font-size: 0.75rem; margin-top: 2px;">Gironde & France</div>
      </div>
      <button class="btn-gps" onclick="locateUser()">📍 Ma position</button>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map', { zoomControl: false }).setView([44.837789, -0.57918], 9);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    let userMarker = null;

    function locateUser() {
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(pos => {
          const { latitude, longitude } = pos.coords;
          if (userMarker) {
            userMarker.setLatLng([latitude, longitude]);
          } else {
            userMarker = L.circleMarker([latitude, longitude], {
              radius: 9, fillColor: '#007aff', color: '#fff', weight: 3, fillOpacity: 1
            }).addTo(map).bindPopup("<b>Vous êtes ici</b>");
          }
          map.flyTo([latitude, longitude], 10);
        });
      }
    }

    // Charger les feux réels détectés par la NASA sur les dernières 24h (France / Gironde)
    async function loadRealFires() {
      try {
        // Source CSV officielle NASA FIRMS pour l'Europe (Dernières détections thermiques)
        const response = await fetch('https://firms.modaps.eosdis.nasa.gov/data/active_fire/modis-c6.1/csv/MODIS_C6_1_Europe_24h.csv');
        const data = await response.text();
        
        const rows = data.split('\n').slice(1);
        let count = 0;

        rows.forEach(row => {
          const cols = row.split(',');
          if (cols.length > 2) {
            const lat = parseFloat(cols[0]);
            const lng = parseFloat(cols[1]);
            const brightness = parseFloat(cols[2]);

            // Filtrer pour afficher la France (Coordonnées métropole)
            if (lat >= 41.0 && lat <= 51.5 && lng >= -5.0 && lng <= 9.5) {
              count++;
              L.circleMarker([lat, lng], {
                radius: 8,
                fillColor: '#ff2a00',
                color: '#ffe600',
                weight: 2,
                fillOpacity: 0.85
              }).addTo(map).bindPopup(`
                <b>🔥 Anomalie Thermique / Feu</b><br>
                <b>Source:</b> Satellite NASA<br>
                <b>Intensité:</b> ${brightness} K<br>
                <b>Détecté:</b> Dernières 24h
              `);
            }
          }
        });

        document.getElementById('fire-count').innerHTML = `Détections 24h : <strong>${count}</strong>`;
      } catch (err) {
        document.getElementById('fire-count').innerHTML = `Détections : <strong>Aucun feu majeur (24h)</strong>`;
      }
    }

    loadRealFires();
  </script>
</body>
</html>
