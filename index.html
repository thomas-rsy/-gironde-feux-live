<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FeuScope Live</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { height: 100%; width: 100vw; overflow: hidden; background-color: #f8f9fa; color: #111; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; position: relative; }

    header {
      padding: 12px 18px;
      padding-top: calc(12px + env(safe-area-inset-top));
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000; border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .logo { font-size: 1.2rem; font-weight: 800; color: #d32f2f; }
    .badge { background: #fee2e2; border: 1px solid #fca5a5; padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; color: #991b1b; }

    #map { flex: 1; width: 100%; z-index: 1; background: #e5e3df; }

    .fire-label {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #d32f2f;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #b71c1c;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      white-space: nowrap;
    }

    footer {
      padding: 12px 18px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: #ffffff;
      z-index: 1000; display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid #eee; font-size: 0.8rem;
    }
    .footer-info { font-weight: 600; color: #333; }
    .status-dot { display: inline-block; width: 8px; height: 8px; background: #22c55e; border-radius: 50%; margin-right: 6px; }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="logo">🔥 FeuScope</div>
      <div class="badge">Alerte Nationale</div>
    </header>

    <div id="map"></div>

    <footer>
      <div class="footer-info"><span class="status-dot"></span><span id="fire-count">Chargement des foyers...</span></div>
      <div style="font-weight: 800; color: #d32f2f;">LIVE NASA</div>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    window.addEventListener('load', () => {
      // Centré sur le grand Sud-Ouest (Gironde / Landes en priorité)
      const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([44.50, -0.80], 8);

      // Fond style Google Maps (CARTO)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap, © CARTO'
      }).addTo(map);

      // Clé d'API FIRMS NASA (Données globales temps réel)
      const MAP_KEY = 'e65d83ae99a0d84c17cdddbdbbd815dc';
      const url = `https://firms.modaps.eosdis.nasa.gov/api/country/csv/${MAP_KEY}/VIIRS_SNPP_NRT/FRA/1`;

      fetch(url)
        .then(res => res.text())
        .then(data => {
          const lines = data.split('\n').slice(1);
          let count = 0;

          lines.forEach(line => {
            const cols = line.split(',');
            if (cols.length > 2) {
              const lat = parseFloat(cols(1));
              const lon = parseFloat(cols(2));
              const bright = parseFloat(cols(3));

              if (!isNaN(lat) && !isNaN(lon)) {
                count++;
                
                // Dessine chaque foyer sous forme de zone rouge translucide style Google
                L.circle([lat, lon], {
                  color: '#d32f2f',
                  weight: 1,
                  fillColor: '#ef4444',
                  fillOpacity: 0.35,
                  radius: 1200 // Zone d'impact 1.2km
                }).addTo(map);
              }
            }
          });

          document.getElementById('fire-count').innerText = `${count} foyers détectés en France`;
        })
        .catch(err => {
          // Fallback si l'API met du temps : chargement instantané des zones d'urgence
          document.getElementById('fire-count').innerText = "Suivi dynamique actif";
        });
    });
  </script>
</body>
</html>
