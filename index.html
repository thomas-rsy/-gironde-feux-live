<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FeuScope Europe Pro</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { height: 100%; width: 100vw; overflow: hidden; background-color: #f8f9fa; color: #111; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; position: relative; }

    /* Top Bar Banner Alert */
    .top-alert {
      background: #fff3e0; border-bottom: 1px solid #ffe0b2; padding: 8px 14px;
      padding-top: calc(8px + env(safe-area-inset-top));
      font-size: 0.75rem; color: #e65100; font-weight: 600; display: flex; align-items: center; justify-content: space-between;
      z-index: 1001;
    }

    /* Floating Search Bar */
    .search-box {
      position: absolute; top: calc(48px + env(safe-area-inset-top)); right: 14px;
      z-index: 1000; display: flex; gap: 6px; background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 6px 12px; border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12); border: 1px solid rgba(0,0,0,0.08);
    }
    .search-box input { border: none; background: transparent; font-size: 0.82rem; outline: none; width: 130px; font-weight: 600; }
    .search-box button { background: #d32f2f; border: none; color: white; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }

    #map { flex: 1; width: 100%; z-index: 1; background: #e5e3df; }

    /* Bottom Player (Animation Panache) */
    .player-card {
      position: absolute; bottom: calc(20px + env(safe-area-inset-bottom)); left: 12px; right: 12px;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 18px; padding: 12px 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      z-index: 1000; display: flex; flex-direction: column; gap: 8px; border: 1px solid rgba(0,0,0,0.05);
    }
    .player-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; font-weight: 800; color: #444; }
    .player-controls { display: flex; align-items: center; gap: 12px; }
    .btn-play { background: #e65100; border: none; width: 36px; height: 36px; border-radius: 50%; color: white; font-size: 1rem; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .timeline { flex: 1; accent-color: #e65100; }
    .btn-now { background: #f0f0f2; border: none; padding: 6px 12px; border-radius: 14px; font-size: 0.72rem; font-weight: 700; color: #333; }

    .air-badge {
      background: #22c55e; color: white; font-size: 0.7rem; font-weight: 800; padding: 3px 8px; border-radius: 10px;
    }
  </style>
</head>
<body>

  <div id="app">
    <div class="top-alert">
      <span>💨 Panache estimé vers l'<b>EST</b> (Vent 17 km/h)</span>
      <span class="air-badge" id="air-status">Air : Bon</span>
    </div>

    <div class="search-box">
      <input type="text" id="citySearch" placeholder="Recherche ville (Europe)..." onkeypress="if(event.key==='Enter') searchCity()">
      <button onclick="searchCity()">🔎</button>
    </div>

    <div id="map"></div>

    <!-- Panneau Animation Panache style feuxgironde.fr -->
    <div class="player-card">
      <div class="player-header">
        <span>SIMULATION DU PANACHE</span>
        <span id="time-display" style="color:#e65100;">Maintenant</span>
      </div>
      <div class="player-controls">
        <button class="btn-play" id="playBtn" onclick="togglePlay()">▶</button>
        <input type="range" class="timeline" id="timeRange" min="0" max="24" step="3" value="0" oninput="updatePlume(this.value)">
        <button class="btn-now" onclick="resetTime()">Maintenant</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map, plumePolygon, isPlaying = false, timer = null;
    let selectedFire = [44.70, -1.05]; // Par défaut sur la Gironde

    window.addEventListener('load', () => {
      // Vue Europe (Zoom 5)
      map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([46.00, 2.00], 5);

      // Fond CARTO
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19, subdomains: 'abcd'
      }).addTo(map);

      // Chargement de l'API NASA FIRMS Europe entière
      const MAP_KEY = 'e65d83ae99a0d84c17cdddbdbbd815dc';
      const europeArea = '-10,35,30,60'; // Portugal -> Grèce / Espagne -> Scandinavie
      
      fetch(`https://firms.modaps.eosdis.nasa.gov/api/area/csv/${MAP_KEY}/VIIRS_SNPP_NRT/${europeArea}/1`)
        .then(res => res.text())
        .then(csvText => {
          const lines = csvText.split('\n').slice(1);
          lines.forEach(line => {
            const cols = line.split(',');
            if (cols.length > 2) {
              const lat = parseFloat(cols[0]);
              const lon = parseFloat(cols[1]);

              if (!isNaN(lat) && !isNaN(lon)) {
                // Création des cercles d'impact cliquables pour cibler la simulation
                const circle = L.circle([lat, lon], {
                  color: '#d32f2f',
                  weight: 1,
                  fillColor: '#ef4444',
                  fillOpacity: 0.45,
                  radius: 1800
                }).addTo(map);

                // Si on clique sur un feu en Europe, la simulation se fixe dessus !
                circle.on('click', () => {
                  selectedFire = [lat, lon];
                  updatePlume(document.getElementById('timeRange').value);
                });
              }
            }
          });
        });

      updatePlume(0);
    });

    // Génération dynamique de la dérive de la fumée (+0h à +24h)
    function updatePlume(hours) {
      hours = parseInt(hours);
      document.getElementById('time-display').innerText = hours === 0 ? "Maintenant" : `+${hours}h`;

      if (plumePolygon) map.removeLayer(plumePolygon);

      const drift = hours * 0.015;
      const spread = 0.05 + (hours * 0.008);

      const plumeCoords = [
        selectedFire,
        [selectedFire[0] + spread, selectedFire[1] + 0.15 + drift],
        [selectedFire[0] + (spread * 1.5), selectedFire[1] + 0.35 + drift],
        [selectedFire[0] - (spread * 1.5), selectedFire[1] + 0.35 + drift],
        [selectedFire[0] - spread, selectedFire[1] + 0.15 + drift]
      ];

      plumePolygon = L.polygon(plumeCoords, {
        color: '#757575',
        weight: 1,
        fillColor: '#424242',
        fillOpacity: Math.min(0.25 + (hours * 0.01), 0.55),
        dashArray: '4, 4'
      }).addTo(map);

      const airBadge = document.getElementById('air-status');
      if (hours >= 6) {
        airBadge.innerText = "Air : Dégradé (+6h)";
        airBadge.style.background = "#f59e0b";
      } else if (hours >= 12) {
        airBadge.innerText = "Air : Média. (+12h)";
        airBadge.style.background = "#ef4444";
      } else {
        airBadge.innerText = "Air : Bon";
        airBadge.style.background = "#22c55e";
      }
    }

    function togglePlay() {
      const btn = document.getElementById('playBtn');
      const range = document.getElementById('timeRange');

      if (isPlaying) {
        clearInterval(timer);
        btn.innerText = '▶';
        isPlaying = false;
      } else {
        btn.innerText = '⏸';
        isPlaying = true;
        timer = setInterval(() => {
          let val = parseInt(range.value) + 3;
          if (val > 24) val = 0;
          range.value = val;
          updatePlume(val);
        }, 1200);
      }
    }

    function resetTime() {
      if (isPlaying) togglePlay();
      document.getElementById('timeRange').value = 0;
      updatePlume(0);
    }

    // Recherche de ville partout en Europe
    function searchCity() {
      const q = document.getElementById('citySearch').value;
      if (!q) return;

      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`)
        .then(r => r.json())
        .then(data => {
          if (data && data.length > 0) {
            const lat = parseFloat(data[0].lat);
            const lon = parseFloat(data[0].lon);

            map.flyTo([lat, lon], 10);

            L.popup()
              .setLatLng([lat, lon])
              .setContent(`<b>📍 ${data[0].display_name.split(',')[0]}</b><br>Délai d'impact fumée estimé selon le vent.`)
              .openOn(map);
          } else {
            alert('Ville introuvable.');
          }
        });
    }
  </script>
</body>
</html>
