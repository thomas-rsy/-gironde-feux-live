<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FeuScope - Live Gironde</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { height: 100%; width: 100vw; overflow: hidden; background-color: #fff; color: #111; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    
    header {
      padding: 15px 20px;
      padding-top: calc(15px + env(safe-area-inset-top));
      background: #ffffff;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000; border-bottom: 1px solid #eee;
    }
    .logo { font-size: 1.3rem; font-weight: 800; color: #d32f2f; }
    .badge { background: #d32f2f; color: #fff; font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; font-weight: 700; }

    #map { flex: 1; width: 100%; z-index: 1; }

    footer {
      padding: 15px 20px;
      padding-bottom: calc(15px + env(safe-area-inset-bottom));
      background: #ffffff;
      z-index: 1000; display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid #eee;
    }
    .status { font-size: 0.85rem; color: #555; }
    .status strong { color: #d32f2f; }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="logo">🔥 FeuScope</div>
      <div class="badge">EFFIS / Copernicus</div>
    </header>

    <div id="map"></div>

    <footer>
      <div class="status" id="status-info">Interrogation satellites Copernicus...</div>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Centré sur la Gironde / Landes
    const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([44.55, -1.15], 9);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    async function loadEffisData() {
      const statusEl = document.getElementById('status-info');
      
      try {
        // Flux GeoJSON officiel Copernicus EFFIS Active Fires (Dernières 24h)
        const url = 'https://effis.jrc.ec.europa.eu/geoserver/effis/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=effis:active_fires.modis.viirs.today&outputFormat=application/json';
        
        const res = await fetch(url);
        if (!res.ok) throw new Error("Erreur réseau EFFIS");
        
        const data = await res.json();
        let count = 0;

        L.geoJSON(data, {
          filter: function(feature) {
            const coords = feature.geometry.coordinates;
            const lng = coords[0];
            const lat = coords[1];
            // Emprise élargie Gironde / Nord Landes
            return (lat >= 44.0 && lat <= 45.6 && lng >= -1.8 && lng <= 0.2);
          },
          pointToLayer: function(feature, latlng) {
            count++;
            return L.circleMarker(latlng, {
              radius: 8,
              color: '#ffffff',
              weight: 1.5,
              fillColor: '#ff1744',
              fillOpacity: 0.85
            }).bindPopup(`<b>🔥 Foyer Détecté (Copernicus)</b><br>Lat: ${latlng.lat.toFixed(3)} | Lng: ${latlng.lng.toFixed(3)}`);
          }
        }).addTo(map);

        if (count > 0) {
          statusEl.innerHTML = `Copernicus : <strong>${count} foyers actifs détectés</strong>`;
        } else {
          statusEl.innerHTML = "Copernicus : Aucun nouveau point sur les dernières heures";
        }

      } catch (err) {
        statusEl.innerHTML = "Erreur de connexion au serveur Copernicus";
      }
    }

    loadEffisData();
  </script>
</body>
</html>
