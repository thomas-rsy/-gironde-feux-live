<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FeuScope - Suivi des feux</title>
  
  <!-- Config PWA / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121212">

  <!-- Leaflet CSS (Carte) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      height: 100%;
      width: 100vw;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    /* En-tête */
    header {
      padding: 15px 20px;
      padding-top: calc(15px + env(safe-area-inset-top));
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 800;
      color: #ff5252;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-dept {
      background: #ff5252;
      color: #fff;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    /* Container de la Carte */
    #map {
      flex: 1;
      width: 100%;
      z-index: 1;
    }

    /* Barre du bas (Statut & Bouton GPS) */
    footer {
      padding: 15px 20px;
      padding-bottom: calc(15px + env(safe-area-inset-bottom));
      background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-info {
      font-size: 0.85rem;
      color: #a0a0a0;
    }

    .status-info strong {
      color: #fff;
    }

    .btn-gps {
      background: #ff5252;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 82, 82, 0.4);
      transition: transform 0.2s;
    }

    .btn-gps:active {
      transform: scale(0.95);
    }

    /* Personnalisation de la carte en dark mode */
    .leaflet-tile-layer {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
    }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="logo">🔥 FeuScope</div>
      <div class="badge-dept">Gironde (33)</div>
    </header>

    <div id="map"></div>

    <footer>
      <div class="status-info">
        <div id="fire-count">Feux actifs : <strong>Chargement...</strong></div>
        <div id="last-update" style="font-size: 0.75rem; margin-top: 2px;">MàJ : En cours...</div>
      </div>
      <button class="btn-gps" onclick="locateUser()">📍 Ma position</button>
    </footer>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Initialisation de la Carte sur la Gironde
    const map = L.map('map', {
      zoomControl: false
    }).setView([44.837789, -0.57918], 9);

    // Fond de carte OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let userMarker = null;

    // 2. Fonction de Géolocalisation
    function locateUser() {
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(position => {
          const { latitude, longitude } = position.coords;
          
          if (userMarker) {
            userMarker.setLatLng([latitude, longitude]);
          } else {
            userMarker = L.circleMarker([latitude, longitude], {
              radius: 8,
              fillColor: '#007aff',
              color: '#ffffff',
              weight: 3,
              opacity: 1,
              fillOpacity: 0.9
            }).addTo(map).bindPopup("Vous êtes ici");
          }
          
          map.flyTo([latitude, longitude], 11);
        }, () => {
          alert("Impossible de récupérer votre position.");
        });
      } else {
        alert("La géolocalisation n'est pas supportée par votre navigateur.");
      }
    }

    // 3. Exemple de feux (données de test pour v0.1)
    const demoFires = [
      { lat: 44.583, lng: -1.15, name: "Test : La Teste-de-Buch", status: "En progression", color: "#ff5252" },
      { lat: 44.500, lng: -0.50, name: "Test : Landiras", status: "Maîtrisé", color: "#ff922b" }
    ];

    demoFires.forEach(fire => {
      L.circleMarker([fire.lat, fire.lng], {
        radius: 12,
        fillColor: fire.color,
        color: '#ffffff',
        weight: 2,
        fillOpacity: 0.8
      }).addTo(map).bindPopup(`<b>${fire.name}</b><br>Statut: ${fire.status}`);
    });

    // Mise à jour de l'affichage
    document.getElementById('fire-count').innerHTML = `Feux récents : <strong>${demoFires.length}</strong>`;
    document.getElementById('last-update').innerText = `MàJ : ${new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'})}`;
  </script>
</body>
</html>
