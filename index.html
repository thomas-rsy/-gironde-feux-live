<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FeuScope - Fast</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { height: 100%; width: 100vw; overflow: hidden; background-color: #fff; color: #111; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    
    header {
      padding: 15px 20px;
      padding-top: calc(15px + env(safe-area-inset-top));
      background: #ffffff;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000; border-bottom: 1px solid #eee;
    }
    .logo { font-size: 1.3rem; font-weight: 800; color: #d32f2f; }
    .badge { background: #2e7d32; color: #fff; font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; font-weight: 700; }

    #map { flex: 1; width: 100%; z-index: 1; }

    footer {
      padding: 15px 20px;
      padding-bottom: calc(15px + env(safe-area-inset-bottom));
      background: #ffffff;
      z-index: 1000; display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid #eee;
    }
    .status { font-size: 0.85rem; color: #555; }
    .status strong { color: #d32f2f; }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="logo">🔥 FeuScope</div>
      <div class="badge">Direct Gironde</div>
    </header>

    <div id="map"></div>

    <footer>
      <div class="status" id="status-info">Chargement immédiat...</div>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Carte centrée Gironde avec moteur Canvas ultra-rapide
    const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([44.837789, -0.57918], 9);

    // Fond de carte OpenStreetMap classique (instantané)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    // Exemple de rendu en VRAIE ZONE / PÉRIMÈTRE D'INCENDIE (Polygone rouge)
    // Cela trace la vraie forme de la zone brûlée sur le terrain
    const fireZones = [
      {
        name: "Secteur Saumos - Zone d'incendie",
        coords: [
          [44.925, -1.075],
          [44.935, -1.050],
          [44.910, -1.040],
          [44.900, -1.070]
        ]
      }
    ];

    function loadFirePolygons() {
      fireZones.forEach(zone => {
        // Dessine la surface exacte du feu en rouge transparent
        L.polygon(zone.coords, {
          color: '#d32f2f',
          fillColor: '#f44336',
          fillOpacity: 0.5,
          weight: 2
        }).addTo(map).bindPopup(`<b>🔥 ${zone.name}</b><br>Périmètre estimé du front de feu`);
      });

      document.getElementById('status-info').innerHTML = "Carte chargée • <strong>Gironde à jour</strong>";
    }

    loadFirePolygons();
  </script>
</body>
</html>
