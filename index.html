<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FeuScope - Gironde NASA</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { height: 100%; width: 100vw; overflow: hidden; background-color: #fff; color: #111; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    
    header {
      padding: 15px 20px;
      padding-top: calc(15px + env(safe-area-inset-top));
      background: #ffffff;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000; border-bottom: 1px solid #eee;
    }
    .logo { font-size: 1.3rem; font-weight: 800; color: #d32f2f; }
    .badge { background: #d32f2f; color: #fff; font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; font-weight: 700; }

    #map { flex: 1; width: 100%; z-index: 1; }

    footer {
      padding: 15px 20px;
      padding-bottom: calc(15px + env(safe-area-inset-bottom));
      background: #ffffff;
      z-index: 1000; display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid #eee;
    }
    .status { font-size: 0.85rem; color: #555; }
    .status strong { color: #d32f2f; }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="logo">🔥 FeuScope</div>
      <div class="badge">NASA Live</div>
    </header>

    <div id="map"></div>

    <footer>
      <div class="status" id="status-info">Analyse données NASA FIRMS...</div>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([44.837789, -0.57918], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    async function loadRealNasaFirms() {
      const statusEl = document.getElementById('status-info');
      
      try {
        // Interrogation de l'API NASA via proxy CORS pour débloquer Safari
        const targetUrl = 'https://firms.modaps.eosdis.nasa.gov/api/country/csv/c46522c7104b281f6213bd8a2d1e21b0/VIIRS_SNPP_NRT/FRA/1';
        const response = await fetch('https://corsproxy.io/?' + encodeURIComponent(targetUrl));
        
        if (!response.ok) throw new Error('Erreur réseau');
        
        const csvData = await response.text();
        const lines = csvData.split('\n').slice(1);
        let fireCount = 0;

        lines.forEach(line => {
          const cols = line.split(',');
          if (cols.length > 2) {
            const lat = parseFloat(cols[1]);
            const lng = parseFloat(cols[2]);
            const brightness = parseFloat(cols[3]);

            // Filtrage strict emprise Gironde / Landes
            if (lat >= 44.2 && lat <= 45.5 && lng >= -1.6 && lng <= 0.2) {
              fireCount++;

              // Pixel thermique réel NASA (résolution 375m)
              L.rectangle([
                [lat - 0.003, lng - 0.003],
                [lat + 0.003, lng + 0.003]
              ], {
                color: '#d32f2f',
                fillColor: '#ff2a00',
                fillOpacity: 0.65,
                weight: 1
              }).addTo(map).bindPopup(`
                <b>🔥 Foyer Thermique Satellite</b><br>
                <b>Intensité :</b> ${brightness} K<br>
                <b>Détection :</b> ${cols[5]} à ${cols[6]} UTC<br>
                <small>Source : NASA VIIRS 375m</small>
              `);
            }
          }
        });

        if (fireCount > 0) {
          statusEl.innerHTML = `NASA FIRMS : <strong>${fireCount} zones d'incendie détectées</strong>`;
        } else {
          statusEl.innerHTML = "NASA FIRMS : <strong>0 foyer thermique actif détecté (24h)</strong>";
        }

      } catch (err) {
        statusEl.innerHTML = "Erreur de chargement des données NASA";
      }
    }

    loadRealNasaFirms();
  </script>
</body>
</html>
