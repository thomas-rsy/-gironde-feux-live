<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FeuScope Gironde - Live</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">

  <!-- Chargement asynchrone des styles Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { height: 100%; width: 100vw; overflow: hidden; background-color: #f8f9fa; color: #111; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; position: relative; }
    
    header {
      padding: 12px 18px;
      padding-top: calc(12px + env(safe-area-inset-top));
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000; border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .logo-container { display: flex; align-items: center; gap: 8px; }
    .logo { font-size: 1.2rem; font-weight: 800; color: #d32f2f; letter-spacing: -0.5px; }
    .subtitle { font-size: 0.75rem; color: #666; font-weight: 500; }
    .btn-panel { background: #f0f0f2; border: none; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: #333; cursor: pointer; }

    #map { flex: 1; width: 100%; z-index: 1; background: #e5e3df; }

    #control-panel {
      position: absolute;
      top: calc(60px + env(safe-area-inset-top));
      right: 12px;
      width: 280px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(15px);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      z-index: 1001;
      display: none;
      border: 1px solid rgba(0,0,0,0.05);
    }
    #control-panel.active { display: block; }
    
    .panel-title { font-size: 0.75rem; font-weight: 700; color: #888; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; }
    .layer-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .layer-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; font-weight: 600; color: #222; }
    .layer-item label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .layer-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: #d32f2f; border-radius: 4px; }

    .info-box { background: #fff3f3; border-radius: 10px; padding: 10px; border-left: 4px solid #d32f2f; font-size: 0.8rem; color: #a71d1d; margin-top: 10px; }

    footer {
      padding: 12px 18px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: #ffffff;
      z-index: 1000; display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid #eee; font-size: 0.8rem; color: #555;
    }
    .status-badge { display: inline-block; width: 8px; height: 8px; background: #2e7d32; border-radius: 50%; margin-right: 6px; }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="logo-container">
        <span class="logo">🔥 FeuScope</span>
        <span class="subtitle">Gironde & Landes</span>
      </div>
      <button class="btn-panel" onclick="togglePanel()">🎛️ Couches</button>
    </header>

    <div id="map"></div>

    <div id="control-panel">
      <div class="panel-title">Cartographie Live</div>
      <div class="layer-group">
        <div class="layer-item">
          <label><input type="checkbox" id="layer-fires" checked onchange="toggleLayers()"> 🔥 Foyers thermiques (NASA)</label>
        </div>
        <div class="layer-item">
          <label><input type="checkbox" id="layer-rain" onchange="toggleLayers()"> 🌧️ Radar Pluie (Live)</label>
        </div>
        <div class="layer-item">
          <label><input type="checkbox" id="layer-towns" checked onchange="toggleLayers()"> 📍 Secteurs clés</label>
        </div>
      </div>

      <div class="info-box">
        ⚠️ <b>Consigne :</b> En cas de fumée importante, fermez les fenêtres et évitez les axes forestiers réservés aux pompiers (SDIS 33/40).
      </div>
    </div>

    <footer>
      <div><span class="status-badge" id="badge"></span><span id="status-text">Chargement ultra-rapide...</span></div>
      <div style="font-weight: 700; color: #d32f2f;">DIRECT</div>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map, firesLayer, rainLayer, townsGroup;

    // On lance la carte uniquement QUAND le navigateur a totalement fini le chargement principal de la page
    window.addEventListener('load', () => {
      
      // Initialisation rapide de la carte
      map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([44.58, -1.15], 9);

      // Fond OpenStreetMap ultra rapide
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap'
      }).addTo(map);

      // Couche NASA WMS optimisée (ne bloque plus la page)
      firesLayer = L.tileLayer.wms('https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi', {
        layers: 'VIIRS_SNPP_Thermal_Anomalies_375m_Day',
        format: 'image/png',
        transparent: true,
        opacity: 0.85,
        attribution: 'NASA GIBS'
      }).addTo(map);

      // Radar Pluie
      rainLayer = L.tileLayer('https://tilecache.rainviewer.com/v2/radar/nowcast/256/{z}/{x}/{y}/2/1_1.png', {
        opacity: 0.6
      });

      // Secteurs clés
      townsGroup = L.layerGroup();
      const sectors = [
        { name: "Secteur Le Porge / Saumos", lat: 44.742, lng: -1.096 },
        { name: "Secteur Biscarrosse / Landes", lat: 44.394, lng: -1.164 },
        { name: "Secteur Bassin d'Arcachon / La Teste", lat: 44.590, lng: -1.147 }
      ];

      sectors.forEach(sec => {
        L.marker([sec.lat, sec.lng]).bindPopup(`<b>📍 ${sec.name}</b><br>Zone sous surveillance`).addTo(townsGroup);
      });
      townsGroup.addTo(map);

      document.getElementById('status-text').innerHTML = "Flux Satellite & Météo Actifs";
    });

    function togglePanel() {
      document.getElementById('control-panel').classList.toggle('active');
    }

    function toggleLayers() {
      if(!map) return;
      const showFires = document.getElementById('layer-fires').checked;
      const showRain = document.getElementById('layer-rain').checked;
      const showTowns = document.getElementById('layer-towns').checked;

      if (showFires) { if (!map.hasLayer(firesLayer)) map.addLayer(firesLayer); }
      else { if (map.hasLayer(firesLayer)) map.removeLayer(firesLayer); }

      if (showRain) { if (!map.hasLayer(rainLayer)) map.addLayer(rainLayer); }
      else { if (map.hasLayer(rainLayer)) map.removeLayer(rainLayer); }

      if (showTowns) { if (!map.hasLayer(townsGroup)) map.addLayer(townsGroup); }
      else { if (map.hasLayer(townsGroup)) map.removeLayer(townsGroup); }
    }
  </script>
</body>
</html>
